[project]
name = "cac-api"
version = "0.1.0"
description = "Compliance Advisory Copilot — FastAPI monolith + async AI worker"
requires-python = ">=3.11"
dependencies = [
    # --- Web ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",       # multipart/form-data (file uploads)
    "httpx>=0.27",
    # --- DB ---
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",                # vector column type on the models
    # --- Config / validation ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # --- Auth plumbing ---
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7.4",
    # --- Async worker infra ---
    "arq>=0.26",
    "redis>=5.2",
    # --- Object storage ---
    "boto3>=1.35",
    # --- Logging ---
    "structlog>=24.4",
]

# NOTE: feature-specific libraries (LLM gateway, orchestration, PDF/OCR parsing,
# embeddings) are intentionally NOT listed. Add them when you build the feature that
# needs them, e.g.: litellm, langgraph, pdfplumber, sentence-transformers.

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
