[project]
name = "cac-api"
version = "0.1.0"
description = "Compliance Advisory Copilot — FastAPI monolith + async AI worker"
requires-python = ">=3.11"
dependencies = [
    # --- Web ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",       # multipart/form-data (file uploads)
    "httpx>=0.27",
    # --- DB ---
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",                # vector column type on the models
    # --- Config / validation ---
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # --- Auth plumbing ---
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    # --- Async worker infra ---
    "arq>=0.26",
    "redis>=5.2",
    # --- Object storage ---
    "boto3>=1.35",
    # --- PDF text extraction ---
    # pdfplumber (MIT, pure Python via pdfminer.six). Chosen over PyMuPDF, which is
    # AGPL-3.0 and would need a paid Artifex licence to ship inside a bank; and over
    # pypdf, which gives no per-character geometry. We need that geometry to map a
    # citation's character offset back to a page — the Stage 3 "show me the source
    # line" moment.
    "pdfplumber>=0.11",
    # --- OCR for scanned PDFs (runs locally; no document leaves the environment) ---
    # RapidOCR is the zero-setup default: pip-only, bundled ONNX models, offline.
    # pytesseract is the higher-accuracy path (better on RBI's italic serif) but needs
    # the Tesseract binary installed separately — the code prefers it when present and
    # silently falls back when it is not. pypdfium2 (rasteriser) comes via pdfplumber.
    "rapidocr>=3.9",
    "onnxruntime>=1.20",
    "pytesseract>=0.3.13",
    "pillow>=11",
    # --- Logging ---
    "structlog>=24.4",
]

# NOTE: feature-specific libraries (LLM gateway, orchestration, PDF/OCR parsing,
# embeddings) are intentionally NOT listed. Add them when you build the feature that
# needs them, e.g.: litellm, langgraph, pdfplumber, sentence-transformers.

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # `Depends(...)` in a default argument IS the FastAPI idiom — the framework
    # resolves it per request, so this is not the shared-mutable-default bug B008 hunts.
    "B008",
    # Our enums are deliberately `(str, Enum)` rather than `StrEnum`: SQLAlchemy
    # persists the member name, and switching changes `str(Member)` from "Class.NAME"
    # to "NAME", which would quietly alter log output and JSON we already emit.
    "UP042",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
